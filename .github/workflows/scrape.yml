name: Scrape IPO + GMP data

on:
  schedule:
    - cron: "0 */2 * * *"   # Every 2 hours
  workflow_dispatch: {}

concurrency:
  group: scrape-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run scrapers and merge
        run: uv run --frozen python -m scraper.merge --out data/ipos.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ipos.json
          git diff --cached --quiet && exit 0
          git commit -m "Update IPO + GMP data"
          # data/ipos.json is fully regenerated each run, so on a push race just
          # keep this run's freshly scraped content rather than merging history.
          for attempt in 1 2 3 4 5; do
            git push && exit 0
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git fetch origin main
            git rebase -X ours origin/main
          done
          echo "Failed to push after retries" >&2
          exit 1
