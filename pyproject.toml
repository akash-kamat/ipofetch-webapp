[project]
name = "ipofetch"
version = "0.1.0"
description = "Indian IPO data API and market operations dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.index:app"
